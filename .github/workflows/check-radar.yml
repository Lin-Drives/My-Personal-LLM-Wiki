name: Check radar intake and handoff

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test intake and task transitions
        run: python -m unittest discover -s tests -v
      - name: Validate sources and catalog
        run: python scripts/radar_pipeline.py validate
