<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
<title id="title">论文雷达与知识维护：动态先发布，研究按需深化</title><desc id="desc">左侧 Kimi Claw 扫描、保存原始来源并检查身份。右侧上方动态经 CI 自动发布，不等待研究审核。下方单 agent 接续研究，重要结论交独立核查，最多两次尝试后保留草稿。个人选题随时加入。</desc>
